<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שווייגר בצפון איטליה - ברוכים השבים!</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* פלטת צבעים מבוקשת */
            --primary: #17a2b8; /* טורקיז */
            --secondary: #8b4513; /* חום */
            --tertiary: #8fbc8f; /* ירוק בהיר */
            
            --bg-color: #f7f9fa; /* אפור/בהיר עדין */
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #eeeeee;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 15px;
            box-sizing: border-box;
            direction: rtl;
        }

        /* הדר ולוגו */
        header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            object-fit: cover;
            margin-bottom: 10px;
        }
        
        .main-title {
            color: var(--primary);
            font-size: 26px;
            font-weight: 700;
            margin: 10px 0 5px;
            background-color: transparent;
        }
        
        .sub-title {
            color: var(--secondary);
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            background-color: transparent;
        }

        /* הודעת סיום טיול */
        .welcome-message {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome-message h2 {
            color: var(--primary);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .welcome-message p {
            color: var(--secondary);
            font-size: 22px;
            font-weight: 600;
            margin: 0;
        }

        /* כרטיסיית פידבק לוואטסאפ */
        .feedback-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 25px 20px;
            margin-bottom: 30px;
            border-top: 6px solid var(--tertiary);
            text-align: center;
        }

        .feedback-card h3 {
            color: var(--primary);
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .feedback-card p {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 120px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Assistant', sans-serif;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
            background-color: var(--bg-color);
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(23, 162, 184, 0.2);
        }
